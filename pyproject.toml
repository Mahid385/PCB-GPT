[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-dsl-kicad"
version = "0.1.0"
description = "A tiny Python circuit DSL compiler that emits KiCad schematics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Circuit DSL" }]
dependencies = []

[project.scripts]
circuit-dsl = "circuit_dsl.cli:main"

[tool.setuptools.packages.find]
include = ["circuit_dsl*"]
